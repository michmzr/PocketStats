name: PocketStats CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    environment: master
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: gradle build & static code analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          READER_ACCESS_TOKEN: ${{ secrets.READER_ACCESS_TOKEN }}
        run: |
          ./gradlew build jacocoTestReport sonar --info -Dsonar.organization=michmzr  -Dsonar.projectKey=michmzr_PocketStats  -Dsonar.host.url=https://sonarcloud.io  -Dsonar.verbose=true
  build:
    needs:
     - tests
    runs-on: ubuntu-latest
    environment: master
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: build backend
        shell: bash
        run: |
          ./gradlew  build -x test
      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app.jar
          path: ./build/libs/app.jar
