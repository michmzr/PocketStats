worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    # A custom header prevents cross-site form POSTs; preflight remains denied.
    map "$request_method:$http_x_pocketstats_sync" $reject_sync_write {
        default 0;
        "POST:1" 0;
        ~^POST: 1;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    client_max_body_size 8k;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    location = / {
        rewrite ^ /index.html last;
    }
    location = /index.html {
        try_files /index.html =404;
    }
    location = /runtime-config.js {
        default_type application/javascript;
        alias /tmp/pocketstats-ui/runtime-config.js;
    }
    location = /favicon.ico {
        try_files /favicon.ico =404;
    }
    location ^~ /js/ {
        try_files $uri =404;
    }
    location ^~ /css/ {
        try_files $uri =404;
    }

    # These endpoints read the approved shared Atlas statistics dataset.
    location = /stats/langs {
        limit_except GET { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/stats/langs;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location = /stats/byPeriods {
        limit_except GET { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/stats/byPeriods;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location = /stats/topTags {
        limit_except GET { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/stats/topTags;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location = /stats/heatmap {
        limit_except GET { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/stats/heatmap;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location = /stats/byDay {
        # This POST computes statistics and has no writes in pinned source.
        limit_except POST { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/stats/byDay;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }

    location = /stats/library {
        limit_except GET { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/stats/library;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    # Configured Readwise synchronization is available through the private UI.
    location = /sync/availability {
        limit_except GET { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/sync/availability;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location = /sync/last/READER {
        limit_except GET POST { deny all; }
        if ($reject_sync_write) { return 403; }
        proxy_read_timeout 300s;
        proxy_pass http://pocketstats:18080/pocketstats/sync/last/READER;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location = /sync/last {
        limit_except POST { deny all; }
        if ($reject_sync_write) { return 403; }
        proxy_read_timeout 300s;
        proxy_pass http://pocketstats:18080/pocketstats/sync/last;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }

    # Retired Pocket auth and every unlisted backend route remain denied.
    location / {
        return 403;
    }
}
}
