worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    client_max_body_size 8k;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files /index.html =404;
    }
    location = /favicon.ico {
        try_files /favicon.ico =404;
    }
    location ^~ /js/ {
        try_files $uri =404;
    }
    location ^~ /css/ {
        try_files $uri =404;
    }

    # These endpoints read the approved shared Atlas statistics dataset.
    location = /stats/langs {
        limit_except GET { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/stats/langs;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location = /stats/byPeriods {
        limit_except GET { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/stats/byPeriods;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location = /stats/topTags {
        limit_except GET { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/stats/topTags;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location = /stats/heatmap {
        limit_except GET { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/stats/heatmap;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location = /stats/byDay {
        # This POST computes statistics and has no writes in pinned source.
        limit_except POST { deny all; }
        proxy_pass http://pocketstats:18080/pocketstats/stats/byDay;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }

    # No sync, authorization, API import or other backend path is forwarded.
    location / {
        return 403;
    }
}
}
