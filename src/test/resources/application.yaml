spring.main.allow-bean-definition-overriding: true

de.flapdoodle.mongodb.embedded.version: 4.0.2

spring:
  data:
    mongodb:
      port: 0

resilience4j.ratelimiter:
  instances:
    readwise-api:
      limitForPeriod: 20
      limitRefreshPeriod: 70s
      timeoutDuration: 60s
      eventConsumerBufferSize: 100